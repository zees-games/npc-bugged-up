; The README studio (dot-bootstrap tools/readme/readme_studio.gd) for this pack: run tools/gen_readme.sh.
; [shot] applies to every bug, [pose] "<id>.<key>" overrides one, "<pose>.<key>" sets a clip's options
; (t = seconds the clip is stepped at 60 fps before the frame, speed).

[shot]
adapter="res://tools/readme_adapter.gd"
yaw=145.0
elevation=14.0
fill=0.84
fill_y=0.80
fov=24.0
supersample=2
poses="idle,attack"

[look]
exposure=1.0
ambient=0.6
key=2.4
fill=0.8
rim=1.8
ground_shadow=0.55
contact=0.4

[pose]
idle.t=1.0
attack.t=0.35
